# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # ---------------------------------------------------------------
    # SSL certificates
    # Dev  : generated by setup.sh → certs/cert.pem + certs/key.pem
    # Prod : replace with Let's Encrypt paths (certbot --nginx -d yourdomain.com)
    # ---------------------------------------------------------------
    ssl_certificate     /path/to/project/certs/cert.pem;
    ssl_certificate_key /path/to/project/certs/key.pem;
    # ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS (1 year) — enable after confirming HTTPS works
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Document root — Vite output
    root /var/www/doc-scanner/dist;
    index index.html;

    # ---------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Required for camera access on mobile (getUserMedia needs HTTPS or localhost)
    add_header Permissions-Policy "camera=(self)" always;

    # ---------------------------------------------------------------
    # Gzip — essential for the large TF.js chunk (~1.8 MB)
    # ---------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        font/woff2;

    # ---------------------------------------------------------------
    # Cache headers
    # ---------------------------------------------------------------

    # Hashed JS/CSS assets — cache forever
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Model files — cache for a week; change when you update the model
    location /model/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # index.html — never cache (SPA entry point)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # ---------------------------------------------------------------
    # SPA fallback — all unmatched routes → index.html
    # ---------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
